name: bigdata-neuf-2026
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports: []
    profiles:
    - complet
    restart: unless-stopped
    volumes:
    - zk-data:/var/lib/zookeeper/data
    - zk-log:/var/lib/zookeeper/log
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
    - zookeeper
    ports:
    - 127.0.0.1:29092:29092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    profiles:
    - complet
    restart: unless-stopped
    volumes:
    - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
      - CMD-SHELL
      - kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 40s
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      kafka:
        condition: service_healthy
    ports:
    - 127.0.0.1:8080:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      DYNAMIC_CONFIG_ENABLED: 'true'
    profiles:
    - complet
    restart: unless-stopped
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
    - discovery.type=single-node
    - ES_JAVA_OPTS=-Xms512m -Xmx512m
    - xpack.security.enabled=false
    ports:
    - 127.0.0.1:9200:9200
    profiles:
    - complet
    - lab1
    - lab2
    restart: unless-stopped
    volumes:
    - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"
        >/dev/null
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 40s
  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
    - 127.0.0.1:5601:5601
    profiles:
    - complet
    - lab1
    - lab2
    restart: unless-stopped
    volumes:
    - kibana-data:/usr/share/kibana/data
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:5601/api/status >/dev/null
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
  ed-pyspark-jupyter:
    image: jupyter/pyspark-notebook:spark-3.3.0
    user: root
    ports:
    - 127.0.0.1:8888:8888
    - 127.0.0.1:4040:4040
    volumes:
    - ./notebooks:/home/jovyan/work
    environment:
      JUPYTER_ENABLE_LAB: 'yes'
    command:
    - start-notebook.sh
    - --NotebookApp.token=bigdata-lab-2026
    profiles:
    - complet
    restart: unless-stopped
  logstash:
    image: docker.elastic.co/logstash/logstash:8.17.0
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
    - 127.0.0.1:9600:9600
    environment:
      LS_JAVA_OPTS: -Xms512m -Xmx512m
      CONFIG_RELOAD_AUTOMATIC: 'true'
      CONFIG_RELOAD_INTERVAL: 3s
    profiles:
    - complet
    - lab2
    restart: unless-stopped
    volumes:
    - ./logstash/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
    - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    - ./data:/usr/share/logstash/data-in:ro
    - logstash-data:/usr/share/logstash/data
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:9600/ >/dev/null
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
volumes:
  es-data: {}
  kibana-data: {}
  kafka-data: {}
  zk-data: {}
  zk-log: {}
  logstash-data: {}

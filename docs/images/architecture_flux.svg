<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>PrediMaint : flux de données en place (séance S10)</title>
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F2933"/>
    </marker>
    <marker id="fleche-gris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A94A0"/>
    </marker>
    <style>
      .titre  { font-size: 15px; font-weight: 700; fill: #1F2933; }
      .sous   { font-size: 12.5px; font-weight: 600; fill: #3E4C59; }
      .txt    { font-size: 12px; fill: #3E4C59; }
      .petit  { font-size: 11px; fill: #52606D; }
      .zone   { font-size: 14px; font-weight: 700; }
      .futur  { font-size: 11.5px; fill: #7B8794; font-style: italic; }
      .label  { font-size: 11.5px; fill: #1F2933; font-weight: 600; }
      .flux   { stroke: #1F2933; stroke-width: 2; fill: none; }
      .pointille { stroke: #8A94A0; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; }
    </style>
  </defs>

  <!-- Fond blanc : lisible dans tous les visualiseurs Markdown, thème clair ou sombre -->
  <rect width="1200" height="700" fill="#FFFFFF"/>

  <text x="600" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2933">PrediMaint · flux de données en place (séance S10)</text>

  <!-- ============ Zones ============ -->
  <rect x="20" y="55" width="250" height="565" rx="12" fill="#F4F6F8" stroke="#9AA5B1" stroke-width="1.5"/>
  <text x="40" y="82" class="zone" fill="#52606D">Windows</text>

  <rect x="290" y="55" width="890" height="565" rx="12" fill="#F2F7FD" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="310" y="82" class="zone" fill="#2B6CB0">Docker · projet compose « predimaint »</text>

  <!-- ============ Windows ============ -->
  <!-- Simulateur -->
  <rect x="40" y="190" width="210" height="160" rx="10" fill="#FFF4E0" stroke="#E69A28" stroke-width="2"/>
  <text x="145" y="215" text-anchor="middle" class="titre">Simulateur Python</text>
  <text x="145" y="240" text-anchor="middle" class="txt">20 machines (mêmes qu'Odoo)</text>
  <text x="145" y="258" text-anchor="middle" class="txt">PRESSE-01 … POMPE-05</text>
  <text x="145" y="276" text-anchor="middle" class="txt">1 mesure / machine / seconde</text>
  <text x="145" y="294" text-anchor="middle" class="txt">--panne · --derive · --rate</text>
  <text x="145" y="320" text-anchor="middle" class="petit">confluent-kafka · Python 3.12</text>
  <text x="145" y="337" text-anchor="middle" class="petit">→ localhost:29092</text>

  <!-- Odoo (prochaine séance) -->
  <rect x="40" y="455" width="210" height="110" rx="10" fill="#FFFFFF" stroke="#8A94A0" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="145" y="480" text-anchor="middle" class="titre" fill="#52606D">Odoo 17 · port 8070</text>
  <text x="145" y="502" text-anchor="middle" class="txt">module predimaint</text>
  <text x="145" y="522" text-anchor="middle" class="futur">alertes reçues par le</text>
  <text x="145" y="538" text-anchor="middle" class="futur">connecteur XML-RPC</text>
  <text x="145" y="555" text-anchor="middle" class="futur">(prochaine séance)</text>

  <!-- ============ Kafka ============ -->
  <!-- Kafka UI -->
  <rect x="345" y="98" width="170" height="50" rx="8" fill="#FFFFFF" stroke="#7B5CC4" stroke-width="1.5"/>
  <text x="430" y="118" text-anchor="middle" class="sous">Kafka UI 0.7.2</text>
  <text x="430" y="136" text-anchor="middle" class="petit">supervision · localhost:8090</text>
  <line x1="430" y1="148" x2="430" y2="175" class="pointille"/>

  <rect x="320" y="175" width="220" height="245" rx="10" fill="#F1ECFB" stroke="#7B5CC4" stroke-width="2"/>
  <text x="430" y="200" text-anchor="middle" class="titre">Kafka 7.5.0</text>
  <text x="430" y="217" text-anchor="middle" class="petit">1 broker · réplication 1</text>

  <rect x="335" y="228" width="190" height="52" rx="6" fill="#FFFFFF" stroke="#7B5CC4" stroke-width="1.5"/>
  <text x="430" y="249" text-anchor="middle" class="sous">sensor.readings</text>
  <text x="430" y="267" text-anchor="middle" class="petit">6 partitions · clé = machine_id</text>

  <rect x="335" y="292" width="190" height="44" rx="6" fill="#FFFFFF" stroke="#8A94A0" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="430" y="311" text-anchor="middle" class="txt">maintenance.alerts</text>
  <text x="430" y="327" text-anchor="middle" class="futur">3 partitions · créé, inutilisé</text>

  <rect x="335" y="346" width="190" height="44" rx="6" fill="#FFFFFF" stroke="#8A94A0" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="430" y="365" text-anchor="middle" class="txt">odoo.events</text>
  <text x="430" y="381" text-anchor="middle" class="futur">3 partitions · créé, inutilisé</text>

  <text x="430" y="408" text-anchor="middle" class="petit">kafka:9092 dans le réseau Docker</text>

  <!-- ZooKeeper -->
  <line x1="430" y1="420" x2="430" y2="455" stroke="#7B5CC4" stroke-width="1.5"/>
  <rect x="345" y="455" width="170" height="50" rx="8" fill="#FFFFFF" stroke="#7B5CC4" stroke-width="1.5"/>
  <text x="430" y="476" text-anchor="middle" class="sous">ZooKeeper 7.5.0</text>
  <text x="430" y="493" text-anchor="middle" class="petit">métadonnées du broker</text>

  <!-- ============ Logstash ============ -->
  <rect x="610" y="100" width="230" height="150" rx="10" fill="#E8F6EE" stroke="#2E9E5B" stroke-width="2"/>
  <text x="725" y="124" text-anchor="middle" class="titre">Logstash 8.17.0</text>
  <text x="725" y="142" text-anchor="middle" class="sous">pipeline « sensors »</text>
  <text x="725" y="165" text-anchor="middle" class="txt">date : ts → @timestamp</text>
  <text x="725" y="183" text-anchor="middle" class="txt">mutate : types, catégorie</text>
  <text x="725" y="201" text-anchor="middle" class="txt">niveau selon les seuils</text>
  <text x="725" y="219" text-anchor="middle" class="txt">file persistante + DLQ</text>
  <text x="725" y="239" text-anchor="middle" class="petit">id = topic-partition-offset</text>

  <!-- ============ Elasticsearch ============ -->
  <rect x="905" y="100" width="255" height="150" rx="10" fill="#FDEEF2" stroke="#D6456B" stroke-width="2"/>
  <text x="1032" y="124" text-anchor="middle" class="titre">Elasticsearch 8.17.0</text>
  <text x="1032" y="147" text-anchor="middle" class="sous">predimaint-sensors-AAAA.MM.JJ</text>
  <text x="1032" y="170" text-anchor="middle" class="txt">un index par jour</text>
  <text x="1032" y="188" text-anchor="middle" class="txt">mapping explicite (template)</text>
  <text x="1032" y="206" text-anchor="middle" class="txt">keyword · float · date</text>
  <text x="1032" y="230" text-anchor="middle" class="petit">1 shard · 0 réplica · statut green</text>

  <!-- ============ Kibana ============ -->
  <rect x="905" y="305" width="255" height="105" rx="10" fill="#E6F6F8" stroke="#1A9BA8" stroke-width="2"/>
  <text x="1032" y="330" text-anchor="middle" class="titre">Kibana 8.17.0</text>
  <text x="1032" y="353" text-anchor="middle" class="txt">tableau de bord temps réel</text>
  <text x="1032" y="371" text-anchor="middle" class="txt">rafraîchi toutes les 5 s</text>
  <text x="1032" y="395" text-anchor="middle" class="petit">localhost:5601</text>

  <!-- ============ Spark ============ -->
  <rect x="610" y="440" width="230" height="140" rx="10" fill="#FFF8E1" stroke="#D9A400" stroke-width="2"/>
  <text x="725" y="464" text-anchor="middle" class="titre">Spark 3.3.0</text>
  <text x="725" y="482" text-anchor="middle" class="sous">Structured Streaming</text>
  <text x="725" y="505" text-anchor="middle" class="txt">moyennes par machine</text>
  <text x="725" y="523" text-anchor="middle" class="txt">fenêtres de 1 minute</text>
  <text x="725" y="541" text-anchor="middle" class="txt">watermark de 2 minutes</text>
  <text x="725" y="565" text-anchor="middle" class="petit">Jupyter, démarré à la demande</text>

  <!-- Console -->
  <rect x="905" y="455" width="255" height="70" rx="10" fill="#FFFFFF" stroke="#D9A400" stroke-width="2"/>
  <text x="1032" y="482" text-anchor="middle" class="titre">Console</text>
  <text x="1032" y="503" text-anchor="middle" class="txt">un tableau toutes les 10 s</text>

  <!-- Cassandra / Redis (prochaine séance) -->
  <rect x="905" y="545" width="255" height="55" rx="10" fill="#FFFFFF" stroke="#8A94A0" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="1032" y="568" text-anchor="middle" class="txt" fill="#52606D">Cassandra · Redis</text>
  <text x="1032" y="587" text-anchor="middle" class="futur">(prochaine séance)</text>

  <!-- ============ Flux ============ -->
  <!-- 1. Simulateur -> Kafka -->
  <path d="M250 254 L333 254" class="flux" marker-end="url(#fleche)"/>
  <text x="292" y="246" text-anchor="middle" class="label">JSON</text>

  <!-- 2. Kafka -> tronc commun -> Logstash et Spark -->
  <path d="M525 254 L575 254" class="flux"/>
  <path d="M575 254 L575 175 L608 175" class="flux" marker-end="url(#fleche)"/>
  <path d="M575 254 L575 510 L608 510" class="flux" marker-end="url(#fleche)"/>
  <circle cx="575" cy="254" r="4" fill="#1F2933"/>
  <text x="583" y="305" class="label">2 groupes de</text>
  <text x="583" y="320" class="label">consommateurs</text>
  <text x="583" y="335" class="label">indépendants</text>
  <text x="583" y="356" class="petit">logstash-predimaint</text>
  <text x="583" y="371" class="petit">spark (sans groupe fixe)</text>

  <!-- 3. Logstash -> Elasticsearch -->
  <path d="M840 175 L903 175" class="flux" marker-end="url(#fleche)"/>
  <text x="871" y="167" text-anchor="middle" class="label">indexe</text>

  <!-- 4. Elasticsearch -> Kibana -->
  <path d="M1032 250 L1032 303" class="flux" marker-end="url(#fleche)"/>
  <text x="1042" y="282" class="label">requêtes et agrégations</text>

  <!-- 5. Spark -> Console -->
  <path d="M840 490 L903 490" class="flux" marker-end="url(#fleche)"/>

  <!-- Futur : Spark -> Cassandra/Redis -->
  <path d="M840 560 L903 572" class="pointille" marker-end="url(#fleche-gris)"/>

  <!-- Futur : maintenance.alerts -> connecteur -> Odoo -->
  <path d="M335 314 L305 314 L305 510 L252 510" class="pointille" marker-end="url(#fleche-gris)"/>

  <!-- ============ Légende ============ -->
  <line x1="40" y1="655" x2="90" y2="655" class="flux" marker-end="url(#fleche)"/>
  <text x="100" y="659" class="txt">flux en place et vérifié (S10)</text>
  <line x1="330" y1="655" x2="380" y2="655" class="pointille" marker-end="url(#fleche-gris)"/>
  <text x="390" y="659" class="txt">prévu aux prochaines séances</text>
  <text x="640" y="659" class="txt">Adresses : Kafka localhost:29092 (Windows) / kafka:9092 (conteneurs) · ports limités à 127.0.0.1</text>
</svg>

# Pipeline « sensors » : Kafka (sensor.readings) -> Elasticsearch (predimaint-sensors-AAAA.MM.JJ)
# Cahier des charges, section 7.6.

input {
  kafka {
    bootstrap_servers => "kafka:9092"          # adresse interne au réseau Docker
    topics            => ["sensor.readings"]
    group_id          => "logstash-predimaint" # groupe de consommateurs : Kafka mémorise l'offset lu
    client_id         => "logstash-sensors"
    consumer_threads  => 2                      # 6 partitions réparties sur 2 threads
    auto_offset_reset => "earliest"             # au tout premier démarrage, on lit depuis le début
    codec             => "json"
    decorate_events   => "basic"                # topic, partition et offset dans [@metadata][kafka]
  }
}

filter {
  if "_jsonparsefailure" in [tags] {
    # Message illisible : on le garde tel quel dans l'index des rejets.
    mutate { add_field => { "source_pipeline" => "sensors" } }
  } else {
    # 1. L'heure de la mesure (ts, ISO 8601 UTC) devient @timestamp.
    date {
      match          => ["ts", "ISO8601"]
      target         => "@timestamp"
      remove_field   => ["ts"]
      tag_on_failure => ["_dateparsefailure"]
    }

    # 2. Types explicites et nettoyage.
    mutate {
      strip     => ["machine_id"]
      uppercase => ["machine_id"]
      convert   => {
        "temperature"  => "float"
        "vibration"    => "float"
        "pression"     => "float"
        "puissance_kw" => "float"
        "bruit_db"     => "float"
      }
      remove_field => ["event", "@version"]
    }

    # 3. Catégorie déduite du préfixe de l'identifiant (comme dans Odoo).
    if [machine_id] =~ /^PRESSE-/ {
      mutate { add_field => { "categorie" => "presses" } }
    } else if [machine_id] =~ /^COMP-/ {
      mutate { add_field => { "categorie" => "compresseurs" } }
    } else if [machine_id] =~ /^CONV-/ {
      mutate { add_field => { "categorie" => "convoyeurs" } }
    } else if [machine_id] =~ /^POMPE-/ {
      mutate { add_field => { "categorie" => "pompes" } }
    } else {
      mutate { add_field => { "categorie" => "inconnue" } }
    }

    # 4. Niveau calculé à partir des seuils (copie des seuils saisis dans Odoo,
    #    module predimaint). Ils seront lus dans Redis à la séance suivante.
    #    niveau = critique si une grandeur dépasse son seuil critique,
    #             surveillance si une grandeur dépasse son seuil d'alerte, sinon normal.
    ruby {
      init => "
        @seuils = {
          'presses'      => { 'temperature' => [60, 75],  'vibration' => [4.5, 7.1], 'pression' => [180, 200], 'puissance_kw' => [45, 55],   'bruit_db' => [85, 95] },
          'compresseurs' => { 'temperature' => [90, 105], 'vibration' => [4.5, 7.1], 'pression' => [8.5, 10],  'puissance_kw' => [33, 39],   'bruit_db' => [80, 90] },
          'convoyeurs'   => { 'temperature' => [70, 85],  'vibration' => [2.8, 4.5],                          'puissance_kw' => [7.5, 9.5], 'bruit_db' => [75, 85] },
          'pompes'       => { 'temperature' => [65, 80],  'vibration' => [2.8, 4.5], 'pression' => [6, 7.5],   'puissance_kw' => [15, 18.5], 'bruit_db' => [80, 90] }
        }
      "
      code => "
        seuils = @seuils[event.get('categorie')] || {}
        niveau = 'normal'
        depassements = []
        seuils.each do |grandeur, (alerte, critique)|
          valeur = event.get(grandeur)
          next if valeur.nil?
          if valeur >= critique
            niveau = 'critique'
            depassements << grandeur
          elsif valeur >= alerte
            niveau = 'surveillance' if niveau == 'normal'
            depassements << grandeur
          end
        end
        event.set('niveau', niveau)
        event.set('depassements', depassements) unless depassements.empty?
        if seuils['temperature']
          event.set('seuil_alerte_temperature', seuils['temperature'][0].to_f)
          event.set('seuil_critique_temperature', seuils['temperature'][1].to_f)
        end
      "
    }

    # 5. Traçabilité Kafka (utile pour mesurer le retard et expliquer l'idempotence).
    mutate {
      add_field => {
        "[kafka][partition]" => "%{[@metadata][kafka][partition]}"
        "[kafka][offset]"    => "%{[@metadata][kafka][offset]}"
      }
    }
    mutate { convert => { "[kafka][partition]" => "integer" "[kafka][offset]" => "integer" } }
  }
}

output {
  if [source_pipeline] == "sensors" {
    elasticsearch {
      hosts           => ["http://elasticsearch:9200"]
      index           => "predimaint-rejects"
      manage_template => false
      ilm_enabled     => false
    }
  } else {
    elasticsearch {
      hosts           => ["http://elasticsearch:9200"]
      index           => "predimaint-sensors-%{+YYYY.MM.dd}"
      # Identifiant déterministe topic-partition-offset : si Logstash relit des messages
      # après une panne, il réécrit les mêmes documents au lieu de créer des doublons.
      document_id     => "%{[@metadata][kafka][topic]}-%{[@metadata][kafka][partition]}-%{[@metadata][kafka][offset]}"
      manage_template => false
      ilm_enabled     => false
    }
  }
}

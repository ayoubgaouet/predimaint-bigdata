# Copie de travail du docker-compose du cours (projet bigdata-neuf-2026, édition Lab 2
# avec Logstash), source : "D:\3GL Alt\big data framework\Lab2_Logstash_complet.zip".
# Le fichier du cours n'est pas modifié. Versions identiques au cours, jamais « latest ».
#
# Changements par rapport au fichier du cours :
#  1. name: predimaint  -> volumes séparés de ceux des labs (pas de mélange de données).
#  2. profils : « pipeline » = les 6 services de la démo ; « spark » = Jupyter/Spark ;
#     « complet » = tout. Jupyter n'est démarré qu'à la demande (économie de mémoire).
#  3. Kafka : création automatique des topics désactivée (on les crée avec le bon
#     nombre de partitions par scripts\creer_topics.ps1).
#  4. Ports Windows : Kafka UI sur 8090 et Jupyter sur 8890, car la VM VirtualBox « mlops-vm »
#     redirige déjà 8080, 8081 et 8888.
#  5. Logstash : monte les pipelines du projet ; Jupyter monte le dossier spark\ et garde
#     en cache le paquet spark-sql-kafka dans spark/.ivy2 (option spark.jars.ivy).
#
# Démarrage : docker compose --profile pipeline up -d --pull never --wait --wait-timeout 600
# Arrêt     : docker compose --profile complet stop     (jamais « down -v »)
name: predimaint
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports: []
    profiles:
    - complet
    - pipeline
    restart: unless-stopped
    volumes:
    - zk-data:/var/lib/zookeeper/data
    - zk-log:/var/lib/zookeeper/log
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
    - zookeeper
    ports:
    - 127.0.0.1:29092:29092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    profiles:
    - complet
    - pipeline
    restart: unless-stopped
    volumes:
    - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
      - CMD-SHELL
      - kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 40s
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      kafka:
        condition: service_healthy
    ports:
    # 8090 côté Windows : 8080 et 8081 sont redirigés par la VM VirtualBox « mlops-vm ».
    - 127.0.0.1:8090:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: predimaint
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      DYNAMIC_CONFIG_ENABLED: 'true'
    profiles:
    - complet
    - pipeline
    restart: unless-stopped
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
    - discovery.type=single-node
    - ES_JAVA_OPTS=-Xms512m -Xmx512m
    - xpack.security.enabled=false
    ports:
    - 127.0.0.1:9200:9200
    profiles:
    - complet
    - pipeline
    restart: unless-stopped
    volumes:
    - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"
        >/dev/null
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 40s
  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
    - 127.0.0.1:5601:5601
    profiles:
    - complet
    - pipeline
    restart: unless-stopped
    volumes:
    - kibana-data:/usr/share/kibana/data
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:5601/api/status >/dev/null
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
  logstash:
    image: docker.elastic.co/logstash/logstash:8.17.0
    depends_on:
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
    - 127.0.0.1:9600:9600
    environment:
      LS_JAVA_OPTS: -Xms512m -Xmx512m
      CONFIG_RELOAD_AUTOMATIC: 'true'
      CONFIG_RELOAD_INTERVAL: 3s
    profiles:
    - complet
    - pipeline
    restart: unless-stopped
    volumes:
    - ./logstash/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
    - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    - ./data:/usr/share/logstash/data-in:ro
    - logstash-data:/usr/share/logstash/data
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:9600/ >/dev/null
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
  ed-pyspark-jupyter:
    image: jupyter/pyspark-notebook:spark-3.3.0
    user: root
    ports:
    # 8890 côté Windows : 8888 est redirigé par la VM VirtualBox « mlops-vm ».
    - 127.0.0.1:8890:8888
    - 127.0.0.1:4040:4040
    volumes:
    # Le cache des paquets Maven (spark.jars.ivy) est dans spark/.ivy2 : téléchargé une fois.
    - ./spark:/home/jovyan/work
    environment:
      JUPYTER_ENABLE_LAB: 'yes'
    command:
    - start-notebook.sh
    - --NotebookApp.token=bigdata-lab-2026
    profiles:
    - complet
    - spark
    restart: unless-stopped
volumes:
  es-data: {}
  kibana-data: {}
  kafka-data: {}
  zk-data: {}
  zk-log: {}
  logstash-data: {}
